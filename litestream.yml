# Litestream replicates the SQLite database to Backblaze B2 so data survives
# Render free-tier spin-downs. Env vars are expanded automatically (see
# https://litestream.io/reference/config/).

# Idle "replica sync" lines are healthy but flood Render logs at info.
# warn keeps uploads/errors visible without the 2s heartbeat.
logging:
  level: warn

dbs:
  - path: ${BOOKCLUB_DB_PATH}
    replica:
      type: s3
      # Bucket must be private (B2: 5418bookclub, us-east-005).
      bucket: 5418bookclub
      path: bookclub
      endpoint: s3.us-east-005.backblazeb2.com
      region: us-east-005
      # 1s default is fine; 10s is enough for a book club and cuts API chatter.
      sync-interval: 10s
      access-key-id: ${B2_KEY_ID}
      secret-access-key: ${B2_APPLICATION_KEY}
