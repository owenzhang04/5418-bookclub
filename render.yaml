services:
  - type: web
    name: 5418-bookclub
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSCODE_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
